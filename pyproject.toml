[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador"
version = "0.1.0"
description = "Motor de busca e catalogacao de obras digitalizadas para o Instituto Sao Bento"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "deep-translator>=1.11",
    "argostranslate>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
